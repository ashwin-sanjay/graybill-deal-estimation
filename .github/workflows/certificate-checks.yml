name: Finite certificate checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['certificates/**', 'proofs/Proof0003.md', 'tools/verify_certificates.py', '.github/workflows/certificate-checks.yml']

permissions:
  contents: read

jobs:
  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install the pinned certificate environment
        run: python -m pip install -r certificates/requirements.txt
      - name: Verify finite and symbolic consequences
        run: python tools/verify_certificates.py --work "$RUNNER_TEMP/certificate-check"
      - name: Retain current receipts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finite-certificate-records
          path: |
            ${{ runner.temp }}/certificate-check/result.json
            ${{ runner.temp }}/certificate-check/logs
          retention-days: 30
      - name: Confirm checks preserve tracked files
        if: always()
        run: git diff --exit-code
